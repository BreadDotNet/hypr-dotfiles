# E-ink palette for tmux (dark mode) -- AUTO-GENERATED by theme/generate.sh

# Pane borders
set -g pane-border-style fg=#303030
set -g pane-active-border-style fg=#87AF87

# Status bar
set -g status-style bg=default,fg=#949494
set -g status-left ""
set -g status-right "#[fg=#585858]#S"

# Window list
set -g window-status-format "#[fg=#585858] #I #W "
set -g window-status-current-format "#[fg=#87AF87,bold] #I #W "
set -g window-status-separator ""

# Messages & command line
set -g message-style bg=#121212,fg=#B2B2B2
set -g message-command-style bg=#121212,fg=#B2B2B2

# Mode (copy mode, etc.)
set -g mode-style bg=#303030,fg=#B2B2B2
