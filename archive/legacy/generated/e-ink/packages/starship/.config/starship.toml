"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface)\
$os\
$username\
[](bg:dim fg:surface)\
$directory\
[](fg:dim bg:border)\
$git_branch\
$git_status\
[](fg:border bg:fg)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:fg bg:strong)\
$docker_context\
[](fg:strong bg:intense)\
$time\
[ ](fg:intense)\
$line_break$character"""

palette = 'e_ink_dark'

add_newline = false

